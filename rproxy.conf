# This configuration is designed for an AWS Elastic Beanstalk
# Multi-Container environment.


events {
    worker_connections 1024;
}


http {

    server {
        listen 80;

        # Basic Proxy Headers - Essential for passing client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Service 1: Example Application (e.g., Strapi, which caused the MIME error) ---
        location /fe/ {

            proxy_pass http://fe:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;

            proxy_buffers 16 4k;
            proxy_buffer_size 2k;
        }

        location /etl/ {
            proxy_pass http://etl:5000/;
        }

        location /gateway/ {
            proxy_pass http://gateway:8000/;
        }

        location / {

            proxy_pass http://cms:1337;

            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_pass_request_headers on;
        }

        # --- Error Handling ---
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
